name: 🕷️ Spider Worker (V3 Raw + Connectors Collector)

on:
  schedule:
    # 15-minute lightweight crawl across healthy RSS/wires & cadence-cached connectors
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual_dispatch'
  repository_dispatch:
    types: [trigger-crawl]

permissions:
  contents: write

concurrency:
  group: data-pipeline-commit
  cancel-in-progress: false

jobs:
  spider-job:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: 'Asia/Shanghai'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install pinned dependencies
        run: pip install -r requirements.txt

      - name: 🕷️ Run V5 Omni-Source Zero-Lag Crawler
        env:
          KEY_TECH: ${{ secrets.KEY_TECH }}
          KEY_GLOBAL: ${{ secrets.KEY_GLOBAL }}
          KEY_FINANCE: ${{ secrets.KEY_FINANCE }}
          KEY_GENERAL: ${{ secrets.KEY_GENERAL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          KEY_1: ${{ secrets.KEY_1 }}
          KEY_2: ${{ secrets.KEY_2 }}
          KEY_3: ${{ secrets.KEY_3 }}
          KEY_4: ${{ secrets.KEY_4 }}
          KEY_5: ${{ secrets.KEY_5 }}
          KEY_6: ${{ secrets.KEY_6 }}
          KEY_7: ${{ secrets.KEY_7 }}
          KEY_8: ${{ secrets.KEY_8 }}
        run: |
          python -m pipeline.fetch_raw --respect-cadence --schedule-source "${{ github.event_name }}"

      - name: 📊 Write GitHub Step Summary
        if: always()
        run: |
          python -c "
          import json
          m = json.load(open('data/manifest.json', encoding='utf-8'))
          r = m.get('raw', {})
          s = r.get('summary', {})
          c = m.get('connectors', {}).get('summary', {})
          print('### 🕷️ V3 Raw & First-Party Crawl Summary')
          print(f'- **Batch ID**: `{r.get(\"latest_batch_id\")}`')
          print(f'- **Fetched At**: `{r.get(\"fetched_at\")}`')
          print(f'- **Status**: `{r.get(\"status\")}`')
          print(f'- **Aggregator Sources**: ok={s.get(\"ok_sources\")}, stale={s.get(\"stale_sources\")}, empty={s.get(\"empty_sources\")}, error={s.get(\"error_sources\")}')
          print(f'- **First-Party Connectors**: healthy={c.get(\"healthy_connectors\")}/{c.get(\"total_connectors\")}, items={c.get(\"total_first_party_items\")}, tools={c.get(\"tech_tools_count\")}, calendar={c.get(\"calendar_events_count\")}')
          print(f'- **Items**: raw={s.get(\"total_raw_items\")}, deduped={s.get(\"deduped_events\")}, deep_enriched={s.get(\"deep_fetched_enriched\")}')
          " >> "$GITHUB_STEP_SUMMARY" || true

      - name: ☁️ Incremental Sync Raw & Wire to Cloudflare R2
        if: success()
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/sync_to_r2.py --scope raw

      - name: 💾 Commit and push atomically
        run: |
          git config user.name 'Spider Bot'
          git config user.email 'spider@bot.com'
          git add -A archives/raw/
          git add data_*.json data/ history/raw_index.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "🕷️ V3 Raw & Connectors Snapshot: $(date '+%Y-%m-%d %H:%M CST')"
          for i in 1 2 3; do
            git fetch origin main && git merge -X ours --no-edit origin/main && git push origin main && exit 0
            echo "Push retry $i after ours-merge..."
            sleep 3
          done
          exit 1
